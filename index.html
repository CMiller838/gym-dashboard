<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gym Log</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
  :root{
    --bg:#0d0d0f; --card:#17171b; --card2:#1e1e23; --border:#2a2a30;
    --text:#f2f2f4; --muted:#8b8b93; --accent:#ff5a1f; --accent2:#3ddc84;
    --danger:#ff5a5a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  #app{max-width:560px; margin:0 auto; padding:0 0 90px 0; min-height:100vh;}

  header.topbar{position:sticky; top:0; z-index:10; background:rgba(13,13,15,0.92);
    backdrop-filter:blur(10px); padding:16px 16px 12px; border-bottom:1px solid var(--border);}
  header.topbar h1{font-size:20px; margin:0; font-weight:700; letter-spacing:-0.3px;}
  header.topbar .sub{color:var(--muted); font-size:13px; margin-top:2px;}

  .tabs{display:flex; gap:6px; padding:12px 16px 4px;}
  .tab{flex:1; text-align:center; padding:9px 0; border-radius:10px; font-size:13px;
    font-weight:600; color:var(--muted); background:var(--card); border:1px solid var(--border);}
  .tab.active{color:#fff; background:var(--accent); border-color:var(--accent);}

  .resume-banner{margin:14px 16px 0; background:linear-gradient(135deg,#ff5a1f,#ff7a3f);
    border-radius:14px; padding:14px 16px; display:flex; justify-content:space-between; align-items:center;}
  .resume-banner .txt{font-weight:700; font-size:14px; color:#fff;}
  .resume-banner .sub2{font-size:12px; color:rgba(255,255,255,0.85); margin-top:2px;}
  .resume-banner button{background:#fff; color:#ff5a1f; border:none; border-radius:10px;
    padding:8px 14px; font-weight:800; font-size:13px;}

  .stats-row{display:flex; gap:10px; padding:14px 16px 4px;}
  .stat{flex:1; background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:14px 10px; text-align:center;}
  .stat .num{font-size:22px; font-weight:800; color:var(--accent);}
  .stat .lbl{font-size:11px; color:var(--muted); margin-top:2px; text-transform:uppercase; letter-spacing:0.4px;}

  section{padding:8px 16px;}
  section h2{font-size:14px; color:var(--muted); text-transform:uppercase; letter-spacing:0.6px;
    margin:18px 0 10px;}

  .session-card{background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:16px; margin-bottom:12px;}
  .session-card .row-top{display:flex; justify-content:space-between; align-items:baseline;}
  .session-card .routine-name{font-weight:700; font-size:16px;}
  .session-card .date{color:var(--muted); font-size:12px;}
  .session-card .meta{color:var(--muted); font-size:13px; margin-top:4px;}
  .session-card .exlist{margin-top:12px; display:flex; flex-direction:column; gap:8px;}
  .exrow{display:flex; justify-content:space-between; align-items:center; font-size:14px;
    padding:8px 10px; background:var(--card2); border-radius:10px;}
  .exrow .exname{font-weight:600;}
  .exrow .exsets{color:var(--muted); font-size:12px; margin-top:2px;}
  .pill{font-size:11px; background:rgba(61,220,132,0.15); color:var(--accent2);
    padding:2px 8px; border-radius:20px; font-weight:700;}

  .pr-card{background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:12px 14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;}
  .pr-card .exname{font-weight:600; font-size:14px;}
  .pr-card .prval{font-weight:800; color:var(--accent); font-size:15px;}
  .pr-card .prdate{color:var(--muted); font-size:11px;}

  .routine-card{background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:16px; margin-bottom:12px;}
  .routine-card .rtop{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .routine-card .rname{font-weight:700; font-size:16px;}
  .routine-card .rmeta{color:var(--muted); font-size:12px; margin-top:2px;}
  .startbtn{background:var(--accent); color:#fff; border:none; border-radius:10px;
    padding:10px 16px; font-weight:700; font-size:13px; white-space:nowrap;}
  .startbtn:disabled{opacity:0.5;}

  .empty{color:var(--muted); text-align:center; padding:40px 20px; font-size:14px;}
  .loading{color:var(--muted); text-align:center; padding:40px 20px; font-size:14px;}

  .setup{padding:60px 24px; text-align:center;}
  .setup h2{font-size:18px; margin-bottom:8px;}
  .setup p{color:var(--muted); font-size:14px; line-height:1.5;}
  .setup input{width:100%; padding:14px; margin-top:16px; border-radius:12px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:14px;}
  .setup button{width:100%; padding:14px; margin-top:12px; border-radius:12px; border:none;
    background:var(--accent); color:#fff; font-weight:700; font-size:15px;}
  .setup .err{color:var(--danger); font-size:13px; margin-top:10px;}
  .setup .hint{font-size:12px; color:var(--muted); margin-top:18px; line-height:1.5; text-align:left;}

  .toolbar{position:fixed; bottom:0; left:0; right:0; background:rgba(13,13,15,0.95);
    backdrop-filter:blur(10px); border-top:1px solid var(--border); padding:10px 16px;
    display:flex; justify-content:center; gap:16px; z-index:20;}
  .toolbar button{background:none; border:none; color:var(--muted); font-size:12px; padding:6px 12px;}
  .toolbar button.reset{color:var(--danger);}

  /* --- Active workout screen --- */
  .workout-header{position:sticky; top:0; z-index:10; background:rgba(13,13,15,0.95);
    backdrop-filter:blur(10px); padding:14px 16px; border-bottom:1px solid var(--border);
    display:flex; justify-content:space-between; align-items:center;}
  .workout-header .wname{font-weight:800; font-size:17px;}
  .workout-header .wtimer{color:var(--accent2); font-size:12px; font-weight:700; margin-top:2px;}
  .workout-header .discardbtn{color:var(--danger); background:none; border:none; font-size:20px; padding:4px 8px;}

  .wex-card{background:var(--card); border:1px solid var(--border); border-radius:16px;
    margin:12px 16px; padding:16px;}
  .wex-card.done{border-color:rgba(61,220,132,0.4);}
  .wex-card .wex-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .wex-card .wex-name{font-weight:700; font-size:16px;}
  .wex-card .wex-target{color:var(--muted); font-size:12px; margin-top:2px;}
  .wex-card .wex-last{background:var(--card2); border-radius:10px; padding:8px 10px;
    margin-top:10px; font-size:12px; color:var(--muted);}
  .wex-card .wex-last b{color:var(--text);}

  .rest-timer{margin-top:8px; background:rgba(255,90,31,0.12); border:1px solid rgba(255,90,31,0.35);
    border-radius:10px; padding:7px 10px; font-size:12px; color:var(--accent); font-weight:700;
    display:flex; justify-content:space-between; align-items:center;}
  .rest-timer button{background:none; border:none; color:var(--accent); font-size:11px; font-weight:700;
    text-decoration:underline;}

  .settable{margin-top:10px; width:100%; border-collapse:collapse;}
  .settable th{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px;
    font-weight:700; padding:4px 4px; text-align:center;}
  .settable th:first-child{text-align:left;}
  .settable td{padding:4px; text-align:center; vertical-align:middle;}
  .setrow .setnum{font-size:13px; font-weight:800; color:var(--muted); width:22px; text-align:left; padding-left:2px;}
  .setrow .prevcell{font-size:12px; color:var(--muted);}
  .setrow input{width:100%; background:var(--card2); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:9px 4px; font-size:14px; text-align:center; min-width:0;}
  .setrow.logged input{background:rgba(61,220,132,0.08); border-color:rgba(61,220,132,0.3); color:var(--accent2);}
  .setrow .checkcell{width:36px;}
  .setrow .logbtn{background:var(--card2); color:var(--muted); border:1px solid var(--border);
    border-radius:8px; width:32px; height:32px; font-weight:900; font-size:15px;}
  .setrow.logged .logbtn{background:var(--accent2); color:#0d0d0f; border-color:var(--accent2);}

  .addsetbtn{margin-top:10px; width:100%; padding:9px; border-radius:10px; border:1px dashed var(--border);
    background:none; color:var(--muted); font-size:13px; font-weight:600;}

  .finish-bar{position:fixed; bottom:0; left:0; right:0; background:rgba(13,13,15,0.97);
    backdrop-filter:blur(10px); border-top:1px solid var(--border); padding:12px 16px; z-index:20;}
  .finish-bar button{width:100%; padding:15px; border-radius:14px; border:none;
    background:var(--accent); color:#fff; font-weight:800; font-size:15px;}

  .overlay{position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:30;
    display:flex; align-items:flex-end; justify-content:center;}
  .overlay-sheet{background:var(--card); width:100%; max-width:560px; border-radius:20px 20px 0 0;
    padding:20px; max-height:70vh; overflow-y:auto;}
  .overlay-sheet h3{margin:0 0 14px; font-size:16px;}
  .overlay-sheet .opt{background:var(--card2); border-radius:12px; padding:14px; margin-bottom:8px;
    font-weight:600; border:1px solid var(--border);}
  .overlay-sheet .cancel{width:100%; padding:12px; margin-top:8px; background:none; border:none;
    color:var(--muted); font-size:14px;}
</style>
</head>
<body>
<div id="app">
  <header class="topbar" id="topHeader">
    <h1>🏋️ Gym Log</h1>
    <div class="sub" id="headerSub">syncing…</div>
  </header>
  <div id="content"></div>
</div>
<div class="toolbar" id="mainToolbar">
  <button onclick="location.reload()">↻ Refresh</button>
  <button class="reset" onclick="resetToken()">⎋ Change token</button>
</div>

<script>
const API = "https://wger.de/api/v2";
const TOKEN_KEY = "wger_api_token";
const ACTIVE_KEY = "active_workout";
let token = localStorage.getItem(TOKEN_KEY);
let exerciseCache = JSON.parse(localStorage.getItem("exercise_name_cache") || "{}");
let activeTab = "history";
let allLogsCache = null; // populated on normal render, used for "last time" lookups
let timerInterval = null;
let restTickInterval = null;

function saveExerciseCache(){ localStorage.setItem("exercise_name_cache", JSON.stringify(exerciseCache)); }
function getActive(){ try{ return JSON.parse(localStorage.getItem(ACTIVE_KEY) || "null"); }catch(e){ return null; } }
function setActive(w){ localStorage.setItem(ACTIVE_KEY, JSON.stringify(w)); }
function clearActive(){ localStorage.removeItem(ACTIVE_KEY); }

async function apiRaw(path, opts){
  const res = await fetch(`${API}${path}`, Object.assign({
    headers: Object.assign({ "Authorization": `Token ${token}`, "Content-Type": "application/json" }, (opts&&opts.headers)||{})
  }, opts||{}));
  if(res.status === 401 || res.status === 403) throw new Error("auth");
  if(!res.ok){ const t = await res.text().catch(()=> ""); throw new Error("http_" + res.status + ":" + t.slice(0,200)); }
  if(res.status === 204) return null;
  return res.json();
}
async function api(path){ return apiRaw(path); }
async function apiPost(path, body){ return apiRaw(path, { method:"POST", body: JSON.stringify(body) }); }
async function apiPatch(path, body){ return apiRaw(path, { method:"PATCH", body: JSON.stringify(body) }); }
async function apiDelete(path){ return apiRaw(path, { method:"DELETE" }); }

async function apiAll(path){
  let results = [];
  let url = `${API}${path}`;
  while(url){
    const res = await fetch(url, { headers: { "Authorization": `Token ${token}` }});
    if(res.status === 401 || res.status === 403) throw new Error("auth");
    if(!res.ok) throw new Error("http_" + res.status);
    const data = await res.json();
    results = results.concat(data.results || []);
    url = data.next;
  }
  return results;
}

async function exerciseName(id){
  if(exerciseCache[id]) return exerciseCache[id];
  try{
    const info = await api(`/exerciseinfo/${id}/?format=json`);
    let name = null;
    for(const t of (info.translations||[])){
      if(t.language === 2){ name = t.name; break; }
    }
    if(!name && info.translations && info.translations.length){ name = info.translations[0].name; }
    name = name || `Exercise #${id}`;
    exerciseCache[id] = name;
    saveExerciseCache();
    return name;
  }catch(e){
    return `Exercise #${id}`;
  }
}

function fmtDate(d){
  const dt = new Date(d);
  return dt.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
}
function daysAgo(dateStr){
  const d = new Date(dateStr);
  const now = new Date();
  return Math.floor((now - d) / 86400000);
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowTimeISO(){
  const d = new Date();
  return d.toTimeString().slice(0,8);
}

function showSetup(errMsg){
  document.getElementById("mainToolbar").style.display = "flex";
  document.getElementById("headerSub").textContent = "not connected";
  document.getElementById("content").innerHTML = `
    <div class="setup">
      <h2>Connect your wger account</h2>
      <p>Paste your wger API token below. It's stored only on this device (localStorage), never sent anywhere except wger.de.</p>
      <input id="tokenInput" type="password" placeholder="API token" autocomplete="off">
      <button onclick="connectToken()">Connect</button>
      ${errMsg ? `<div class="err">${errMsg}</div>` : ""}
      <div class="hint">
        Get your token: wger.de → Preferences → API token (or /api/v2/token in your account).
      </div>
    </div>`;
}

function connectToken(){
  const val = document.getElementById("tokenInput").value.trim();
  if(!val) return;
  localStorage.setItem(TOKEN_KEY, val);
  token = val;
  render();
}

function resetToken(){
  if(confirm("Disconnect this account and clear the saved token?")){
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem("exercise_name_cache");
    localStorage.removeItem(ACTIVE_KEY);
    location.reload();
  }
}

function tabsHtml(){
  return `<div class="tabs">
    <div class="tab ${activeTab==='history'?'active':''}" onclick="setTab('history')">History</div>
    <div class="tab ${activeTab==='prs'?'active':''}" onclick="setTab('prs')">PRs</div>
    <div class="tab ${activeTab==='routines'?'active':''}" onclick="setTab('routines')">Routines</div>
  </div>`;
}
function setTab(t){ activeTab = t; render(); }

function resumeBannerHtml(){
  const w = getActive();
  if(!w) return "";
  const mins = Math.max(0, Math.round((Date.now() - w.startedAtMs) / 60000));
  return `<div class="resume-banner">
    <div><div class="txt">${w.dayName} in progress</div><div class="sub2">${mins} min elapsed · tap to resume</div></div>
    <button onclick="renderActiveWorkout()">Resume</button>
  </div>`;
}

async function render(){
  if(!token){ showSetup(); return; }
  const active = getActive();
  if(active){ renderActiveWorkout(); return; }

  document.getElementById("mainToolbar").style.display = "flex";
  document.getElementById("headerSub").textContent = "syncing…";
  document.getElementById("content").innerHTML = resumeBannerHtml() + tabsHtml() + `<div class="loading">Loading…</div>`;

  try{
    const [sessions, logs, routines] = await Promise.all([
      apiAll(`/workoutsession/?format=json&ordering=-date&limit=100`),
      apiAll(`/workoutlog/?format=json&ordering=-date&limit=500`),
      apiAll(`/routine/?format=json&is_template=false&limit=100`)
    ]);
    allLogsCache = logs;

    document.getElementById("headerSub").textContent =
      sessions.length ? `${sessions.length} session${sessions.length===1?'':'s'} logged` : "connected";

    const routineById = {};
    routines.forEach(r => routineById[r.id] = r);

    const logsBySession = {};
    logs.forEach(l => {
      if(!logsBySession[l.session]) logsBySession[l.session] = [];
      logsBySession[l.session].push(l);
    });

    if(activeTab === "history"){
      await renderHistory(sessions, logsBySession, routineById);
    } else if(activeTab === "prs"){
      await renderPRs(logs);
    } else if(activeTab === "routines"){
      renderRoutines(routines);
    }
  }catch(e){
    if(e.message === "auth"){
      showSetup("Token rejected — check it's correct and try again.");
    } else {
      document.getElementById("content").innerHTML = resumeBannerHtml() + tabsHtml() +
        `<div class="empty">Couldn't load data (${e.message}). Pull to refresh or check your connection.</div>`;
    }
  }
}

async function renderHistory(sessions, logsBySession, routineById){
  const content = document.getElementById("content");
  if(!sessions.length){
    content.innerHTML = resumeBannerHtml() + tabsHtml() + `<div class="empty">No workouts logged yet.<br>Tap Routines → Start to log your first one.</div>`;
    return;
  }

  const totalSessions = sessions.length;
  const last7 = sessions.filter(s => daysAgo(s.date) <= 7).length;
  const uniqueDates = [...new Set(sessions.map(s=>s.date))];
  let streak = 0;
  let checkDate = new Date();
  checkDate.setHours(0,0,0,0);
  const dateSet = new Set(uniqueDates);
  for(let i=0;i<400;i++){
    const iso = checkDate.toISOString().slice(0,10);
    if(dateSet.has(iso)){ streak++; checkDate.setDate(checkDate.getDate()-1); }
    else if(i===0){ checkDate.setDate(checkDate.getDate()-1); continue; }
    else break;
  }

  let html = resumeBannerHtml() + tabsHtml();
  html += `<div class="stats-row">
    <div class="stat"><div class="num">${totalSessions}</div><div class="lbl">Total</div></div>
    <div class="stat"><div class="num">${last7}</div><div class="lbl">Last 7d</div></div>
    <div class="stat"><div class="num">${streak}</div><div class="lbl">Streak</div></div>
  </div>`;

  html += `<section><h2>Recent Sessions</h2><div id="sessionList"></div></section>`;
  content.innerHTML = html;

  const listEl = document.getElementById("sessionList");
  for(const s of sessions.slice(0, 30)){
    const sLogs = logsBySession[s.id] || [];
    const routine = routineById[s.routine];
    const exGroups = {};
    for(const l of sLogs){
      if(!exGroups[l.exercise]) exGroups[l.exercise] = [];
      exGroups[l.exercise].push(l);
    }
    const exIds = Object.keys(exGroups);
    const names = await Promise.all(exIds.map(id => exerciseName(id)));

    let exHtml = "";
    exIds.forEach((id, i) => {
      const sets = exGroups[id];
      const setStr = sets.map(x => `${parseFloat(x.weight||0)}kg×${parseFloat(x.repetitions||0)}`).join(", ");
      exHtml += `<div class="exrow">
        <div><div class="exname">${names[i]}</div><div class="exsets">${setStr}</div></div>
        <div class="pill">${sets.length} set${sets.length===1?'':'s'}</div>
      </div>`;
    });
    if(!exHtml) exHtml = `<div class="exrow"><div class="exname" style="color:var(--muted)">No sets logged for this session</div></div>`;

    const card = document.createElement("div");
    card.className = "session-card";
    card.innerHTML = `
      <div class="row-top">
        <div class="routine-name">${routine ? routine.name : "Workout"}</div>
        <div class="date">${fmtDate(s.date)}</div>
      </div>
      <div class="meta">${exIds.length} exercise${exIds.length===1?'':'s'}${s.impression ? " · felt " + ({1:"bad",2:"ok",3:"good"}[s.impression]||"") : ""}</div>
      <div class="exlist">${exHtml}</div>
    `;
    listEl.appendChild(card);
  }
}

async function renderPRs(logs){
  const content = document.getElementById("content");
  if(!logs.length){
    content.innerHTML = resumeBannerHtml() + tabsHtml() + `<div class="empty">No sets logged yet — PRs will show up once you have data.</div>`;
    return;
  }
  const bestByExercise = {};
  for(const l of logs){
    const w = parseFloat(l.weight || 0);
    if(w <= 0) continue;
    const cur = bestByExercise[l.exercise];
    if(!cur || w > cur.weight){
      bestByExercise[l.exercise] = { weight: w, reps: parseFloat(l.repetitions||0), date: l.date };
    }
  }
  const exIds = Object.keys(bestByExercise);
  if(!exIds.length){
    document.getElementById("content").innerHTML = resumeBannerHtml() + tabsHtml() + `<div class="empty">No weighted sets logged yet.</div>`;
    return;
  }
  const names = await Promise.all(exIds.map(id => exerciseName(id)));
  const rows = exIds.map((id,i) => ({ name: names[i], ...bestByExercise[id] }))
    .sort((a,b) => b.weight - a.weight);

  let html = resumeBannerHtml() + tabsHtml() + `<section><h2>Personal Records</h2>`;
  for(const r of rows){
    html += `<div class="pr-card">
      <div><div class="exname">${r.name}</div><div class="prdate">${fmtDate(r.date)}</div></div>
      <div class="prval">${r.weight}kg × ${r.reps}</div>
    </div>`;
  }
  html += `</section>`;
  document.getElementById("content").innerHTML = html;
}

function renderRoutines(routines){
  const content = document.getElementById("content");
  if(!routines.length){
    content.innerHTML = resumeBannerHtml() + tabsHtml() + `<div class="empty">No routines found.</div>`;
    return;
  }
  let html = resumeBannerHtml() + tabsHtml() + `<section><h2>Your Routines</h2>`;
  const sorted = [...routines].sort((a,b) => new Date(b.created) - new Date(a.created));
  for(const r of sorted){
    html += `<div class="routine-card">
      <div class="rtop">
        <div>
          <div class="rname">${r.name}</div>
          <div class="rmeta">${r.start} → ${r.end}${r.description ? " · " + r.description : ""}</div>
        </div>
        <button class="startbtn" onclick="startWorkout(${r.id})">▶ Start</button>
      </div>
    </div>`;
  }
  html += `</section>`;
  content.innerHTML = html;
}

// ---------- ACTIVE WORKOUT ----------

function parseConfigValue(configArr, fallback){
  if(configArr && configArr.length) return parseFloat(configArr[0].value);
  return fallback;
}

async function buildEntriesFromDay(day, allLogs){
  // flatten slots -> entries, in order
  const flat = [];
  for(const slot of (day.slots||[]).sort((a,b)=>a.order-b.order)){
    for(const entry of (slot.entries||[]).sort((a,b)=>a.order-b.order)){
      const restSeconds = parseConfigValue(entry.rest_configs, 90);
      const setNrTarget = parseConfigValue(entry.set_nr_configs, 3);
      flat.push({ slotEntryId: entry.id, exerciseId: entry.exercise, restSeconds, setNrTarget });
    }
  }
  const names = await Promise.all(flat.map(e => exerciseName(e.exerciseId)));

  // "last time" per exercise: most recent date this exercise appears in logs, then all sets from that date
  const logsByExercise = {};
  for(const l of allLogs){
    if(!logsByExercise[l.exercise]) logsByExercise[l.exercise] = [];
    logsByExercise[l.exercise].push(l);
  }

  return flat.map((f, i) => {
    const exLogs = (logsByExercise[f.exerciseId] || []).slice().sort((a,b)=> new Date(b.date)-new Date(a.date) || b.id-a.id);
    let lastTime = [];
    if(exLogs.length){
      const mostRecentDate = exLogs[0].date;
      lastTime = exLogs.filter(l => l.date === mostRecentDate)
        .sort((a,b)=>a.id-b.id)
        .map(l => ({ weight: parseFloat(l.weight||0), reps: parseFloat(l.repetitions||0) }));
    }
    return {
      slotEntryId: f.slotEntryId,
      exerciseId: f.exerciseId,
      name: names[i],
      setCount: Math.max(1, Math.round(f.setNrTarget || 3)),
      restSeconds: f.restSeconds || 90,
      restEndMs: null,
      lastTime,
      loggedByRow: {}
    };
  });
}

async function startWorkout(routineId){
  if(getActive()){ renderActiveWorkout(); return; }
  document.getElementById("content").innerHTML = `<div class="loading">Setting up workout…</div>`;
  try{
    const structure = await api(`/routine/${routineId}/structure/?format=json`);
    const nonRestDays = (structure.days||[]).filter(d => !d.is_rest && (d.slots||[]).length);
    if(!nonRestDays.length){ alert("This routine has no exercises configured."); render(); return; }
    if(nonRestDays.length === 1){
      await launchDay(structure, nonRestDays[0]);
    } else {
      showDayPicker(structure, nonRestDays);
    }
  }catch(e){
    alert("Couldn't load routine: " + e.message);
    render();
  }
}

function showDayPicker(structure, days){
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `<div class="overlay-sheet">
    <h3>Which day?</h3>
    ${days.map((d,i) => `<div class="opt" data-i="${i}">${d.name}</div>`).join("")}
    <button class="cancel" id="dpCancel">Cancel</button>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelectorAll(".opt").forEach(el => {
    el.onclick = async () => {
      const day = days[parseInt(el.dataset.i)];
      document.body.removeChild(overlay);
      await launchDay(structure, day);
    };
  });
  document.getElementById("dpCancel").onclick = () => document.body.removeChild(overlay);
}

async function launchDay(structure, day){
  document.getElementById("content").innerHTML = `<div class="loading">Setting up workout…</div>`;
  try{
    const logs = allLogsCache || await apiAll(`/workoutlog/?format=json&ordering=-date&limit=500`);
    const entries = await buildEntriesFromDay(day, logs);

    const session = await apiPost(`/workoutsession/?format=json`, {
      routine: structure.id,
      day: day.id,
      date: todayISO(),
      time_start: nowTimeISO()
    });

    const w = {
      sessionId: session.id,
      routineId: structure.id,
      routineName: structure.name,
      dayId: day.id,
      dayName: day.name || structure.name,
      startedAtMs: Date.now(),
      entries
    };
    setActive(w);
    renderActiveWorkout();
  }catch(e){
    if(String(e.message).includes("500") || String(e.message).toLowerCase().includes("unique")){
      alert("You already have an unfinished session today for this routine (started elsewhere, like the wger app). Finish or delete that session first, then start again here.");
    } else {
      alert("Couldn't start workout: " + e.message);
    }
    render();
  }
}

function fmtRest(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return m>0 ? `${m}min ${s}s` : `${s}s`;
}

function rowCount(entry){
  return Math.max(entry.setCount||1, ...Object.keys(entry.loggedByRow||{}).map(k=>parseInt(k)+1), 1);
}

function renderActiveWorkout(){
  const w = getActive();
  if(!w){ render(); return; }

  document.getElementById("mainToolbar").style.display = "none";
  document.getElementById("topHeader").innerHTML = `
    <div>
      <div class="wname">${w.dayName}</div>
      <div class="wtimer" id="wtimer">0 min</div>
    </div>
    <button class="discardbtn" onclick="discardWorkout()">✕</button>
  `;

  let html = "";
  w.entries.forEach((entry, idx) => {
    const rows = rowCount(entry);
    const doneCount = Object.keys(entry.loggedByRow||{}).length;
    const isDone = doneCount >= (entry.setCount||1);

    let rowsHtml = "";
    for(let ri=0; ri<rows; ri++){
      const logged = entry.loggedByRow[ri];
      const prev = entry.lastTime[ri];
      const prevStr = prev ? `${prev.weight}kg×${prev.reps}` : "—";
      if(logged){
        rowsHtml += `<tr class="setrow logged">
          <td class="setnum">${ri+1}</td>
          <td class="prevcell">${prevStr}</td>
          <td><input value="${logged.weight}" disabled></td>
          <td><input value="${logged.reps}" disabled></td>
          <td class="checkcell"><button class="logbtn" onclick="unlogSet(${idx},${ri})">✓</button></td>
        </tr>`;
      } else {
        const suggestWeight = prev ? prev.weight : (entry.lastTime.length ? entry.lastTime[0].weight : "");
        const suggestReps = prev ? prev.reps : (entry.lastTime.length ? entry.lastTime[0].reps : "");
        rowsHtml += `<tr class="setrow">
          <td class="setnum">${ri+1}</td>
          <td class="prevcell">${prevStr}</td>
          <td><input type="number" inputmode="decimal" id="w_${idx}_${ri}" placeholder="${suggestWeight||'kg'}" value="${suggestWeight||''}"></td>
          <td><input type="number" inputmode="decimal" id="r_${idx}_${ri}" placeholder="${suggestReps||'reps'}" value="${suggestReps||''}"></td>
          <td class="checkcell"><button class="logbtn" onclick="logSet(${idx},${ri})">✓</button></td>
        </tr>`;
      }
    }

    const remaining = entry.restEndMs ? Math.max(0, Math.ceil((entry.restEndMs - Date.now())/1000)) : 0;
    const restHtml = remaining > 0
      ? `<div class="rest-timer" id="rest_${idx}" data-end="${entry.restEndMs}">
           <span>Rest: <span id="restsec_${idx}">${fmtRest(remaining)}</span></span>
           <button onclick="skipRest(${idx})">Skip</button>
         </div>`
      : "";

    html += `<div class="wex-card ${isDone?'done':''}">
      <div class="wex-top">
        <div>
          <div class="wex-name">${entry.name}</div>
          <div class="wex-target">Target: ${entry.setCount} sets · Rest ${fmtRest(entry.restSeconds)} · ${doneCount}/${entry.setCount} done</div>
        </div>
      </div>
      <div class="wex-last">Last time: <b>${entry.lastTime.length ? entry.lastTime.map(s=>`${s.weight}kg×${s.reps}`).join(", ") : "No previous data"}</b></div>
      ${restHtml}
      <table class="settable">
        <thead><tr><th>Set</th><th>Previous</th><th>Kg</th><th>Reps</th><th></th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
      <button class="addsetbtn" onclick="addSetRow(${idx})">+ Add Set</button>
    </div>`;
  });

  html += `<div style="height:80px"></div>`;
  document.getElementById("content").innerHTML = html;

  const finishBar = document.getElementById("finishBar");
  if(!finishBar){
    const bar = document.createElement("div");
    bar.className = "finish-bar";
    bar.id = "finishBar";
    bar.innerHTML = `<button onclick="finishWorkout()">Finish Workout</button>`;
    document.body.appendChild(bar);
  }

  if(timerInterval) clearInterval(timerInterval);
  updateTimer();
  timerInterval = setInterval(updateTimer, 30000);

  if(restTickInterval) clearInterval(restTickInterval);
  restTickInterval = setInterval(tickRestTimers, 1000);
}

function updateTimer(){
  const w = getActive();
  if(!w) return;
  const el = document.getElementById("wtimer");
  if(!el) return;
  const mins = Math.max(0, Math.round((Date.now() - w.startedAtMs) / 60000));
  el.textContent = `${mins} min elapsed`;
}

function tickRestTimers(){
  const w = getActive();
  if(!w) return;
  w.entries.forEach((entry, idx) => {
    const box = document.getElementById(`rest_${idx}`);
    if(!entry.restEndMs){ if(box) box.remove(); return; }
    const remaining = Math.max(0, Math.ceil((entry.restEndMs - Date.now())/1000));
    if(remaining <= 0){
      entry.restEndMs = null;
      setActive(w);
      if(box) box.remove();
      return;
    }
    const secEl = document.getElementById(`restsec_${idx}`);
    if(secEl) secEl.textContent = fmtRest(remaining);
  });
}

function addSetRow(idx){
  const w = getActive();
  if(!w) return;
  const entry = w.entries[idx];
  entry.setCount = rowCount(entry) + 1;
  setActive(w);
  renderActiveWorkout();
}

function skipRest(idx){
  const w = getActive();
  if(!w) return;
  w.entries[idx].restEndMs = null;
  setActive(w);
  renderActiveWorkout();
}

async function logSet(idx, ri){
  const w = getActive();
  if(!w) return;
  const entry = w.entries[idx];
  const weightVal = parseFloat(document.getElementById(`w_${idx}_${ri}`).value);
  const repsVal = parseFloat(document.getElementById(`r_${idx}_${ri}`).value);
  if(isNaN(weightVal) || isNaN(repsVal)){ alert("Enter weight and reps"); return; }

  try{
    const log = await apiPost(`/workoutlog/?format=json`, {
      session: w.sessionId,
      routine: w.routineId,
      exercise: entry.exerciseId,
      slot_entry: entry.slotEntryId,
      weight: weightVal,
      repetitions: repsVal,
      date: new Date().toISOString()
    });
    entry.loggedByRow[ri] = { id: log.id, weight: weightVal, reps: repsVal };
    entry.restEndMs = Date.now() + (entry.restSeconds*1000);
    setActive(w);
    renderActiveWorkout();
  }catch(e){
    alert("Couldn't log set: " + e.message);
  }
}

async function unlogSet(idx, ri){
  const w = getActive();
  if(!w) return;
  const entry = w.entries[idx];
  const logged = entry.loggedByRow[ri];
  if(!logged) return;
  if(!confirm("Remove this set?")) return;
  try{
    await apiDelete(`/workoutlog/${logged.id}/`);
    delete entry.loggedByRow[ri];
    setActive(w);
    renderActiveWorkout();
  }catch(e){
    alert("Couldn't delete: " + e.message);
  }
}

async function finishWorkout(){
  const w = getActive();
  if(!w) return;
  const totalSets = w.entries.reduce((sum,e) => sum + Object.keys(e.loggedByRow||{}).length, 0);
  if(!confirm(`Finish workout? ${totalSets} set${totalSets===1?'':'s'} logged.`)) return;
  try{
    await apiPatch(`/workoutsession/${w.sessionId}/`, { time_end: nowTimeISO() });
  }catch(e){ /* non-fatal */ }
  clearActive();
  if(timerInterval) clearInterval(timerInterval);
  if(restTickInterval) clearInterval(restTickInterval);
  const bar = document.getElementById("finishBar");
  if(bar) bar.remove();
  activeTab = "history";
  render();
}

async function discardWorkout(){
  const w = getActive();
  if(!w) return;
  if(!confirm("Discard this workout? Logged sets will be deleted.")) return;
  try{
    for(const entry of w.entries){
      for(const ri of Object.keys(entry.loggedByRow||{})){
        await apiDelete(`/workoutlog/${entry.loggedByRow[ri].id}/`).catch(()=>{});
      }
    }
    await apiDelete(`/workoutsession/${w.sessionId}/`).catch(()=>{});
  }catch(e){ /* best effort */ }
  clearActive();
  if(timerInterval) clearInterval(timerInterval);
  if(restTickInterval) clearInterval(restTickInterval);
  const bar = document.getElementById("finishBar");
  if(bar) bar.remove();
  render();
}

render();
</script>
