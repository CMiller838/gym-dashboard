<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gym Log</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#15181b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
  :root{
    --bg:#15181b; --card:#1c2024; --card2:#22262b; --border:#2c3237;
    --text:#e4e8eb; --muted:#7c868e; --accent:#4fb0ff; --accent2:#4fb0ff;
    --danger:#ff6b5e; --gold:#f2c14e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Inter','SFMono-Regular',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  #app{max-width:480px; margin:0 auto; padding:0 0 90px 0; min-height:100vh;}

  header.topbar{position:sticky; top:0; z-index:10; background:rgba(21,24,27,0.92);
    backdrop-filter:blur(10px); padding:22px 18px 16px; border-bottom:1px solid var(--border);}
  header.topbar h1{font-size:15px; margin:0; font-weight:700; letter-spacing:.08em; text-transform:uppercase;}
  header.topbar .sub{color:var(--muted); font-size:13px; margin-top:6px;}

  .tabs{display:flex; gap:6px; padding:12px 16px 4px;}
  .tab{flex:1; text-align:center; padding:9px 0; border-radius:10px; font-size:11.5px;
    font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted);
    background:var(--card); border:1.5px solid var(--border);}
  .tab.active{color:#08131f; background:var(--accent); border-color:var(--accent);}

  .stats-row{display:flex; gap:10px; padding:14px 16px 4px;}
  .stat{flex:1; background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:16px 8px; text-align:center;}
  .stat .num{font-size:23px; font-weight:700; color:var(--text); font-variant-numeric:tabular-nums;}
  .stat .lbl{font-size:10px; color:var(--muted); margin-top:4px; text-transform:uppercase; letter-spacing:.06em; font-weight:700;}

  section{padding:8px 16px;}
  section h2{font-size:12.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em;
    margin:18px 0 10px; font-weight:700;}

  .session-card{background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:16px; margin-bottom:12px;}
  .session-card .row-top{display:flex; justify-content:space-between; align-items:baseline;}
  .session-card .routine-name{font-weight:700; font-size:15px;}
  .session-card .date{color:var(--muted); font-size:12px;}
  .session-card .meta{color:var(--muted); font-size:12.5px; margin-top:4px;}
  .session-card .exlist{margin-top:12px; display:flex; flex-direction:column; gap:8px;}
  .exrow{display:flex; justify-content:space-between; align-items:center; font-size:14px;
    padding:8px 10px; background:var(--card2); border-radius:10px;}
  .exrow .exname{font-weight:600;}
  .exrow .exsets{color:var(--muted); font-size:12px; margin-top:2px;}
  .pill{font-size:11px; background:rgba(79,176,255,0.15); color:var(--accent);
    padding:2px 8px; border-radius:8px; font-weight:700;}

  .pr-card{background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;}
  .pr-card .exname{font-weight:700; font-size:14px;}
  .pr-card .prval{font-weight:700; color:var(--gold); font-size:15px; font-variant-numeric:tabular-nums;}
  .pr-card .prdate{color:var(--muted); font-size:11px;}

  .summary-card{display:flex; flex-direction:column; justify-content:center; align-items:center;
    text-align:center; min-height:60vh; padding:20px;}
  .summary-hero{font-size:40px; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums;}
  .summary-sub{color:var(--muted); font-size:14px; margin-top:6px;}
  .summary-card .pr-card, .summary-card .muscle-row{width:100%; max-width:340px; text-align:left;}
  .muscle-row{background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; margin-bottom:10px; display:flex; justify-content:space-between;
    font-size:14px; font-weight:600;}
  .summary-dots{display:flex; gap:8px; margin:16px 0;}
  .summary-dots .dot{width:8px; height:8px; border-radius:50%; background:var(--border);}
  .summary-dots .dot.active{background:var(--accent);}
  .pr-badge{font-size:11px; font-weight:700; color:var(--gold); border:1.5px solid var(--gold);
    border-radius:8px; padding:2px 8px; margin-left:6px; white-space:nowrap; text-transform:uppercase; letter-spacing:.03em;}
  .summary-card .donebtn{background:var(--accent); color:#08131f; border:none; border-radius:10px;
    padding:14px 22px; font-weight:700; font-size:14.5px; min-height:48px; text-transform:uppercase; letter-spacing:.03em;}

  .routine-card{background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:16px; margin-bottom:12px;}
  .routine-card .rtop{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .routine-card .rname{font-weight:700; font-size:15px;}
  .routine-card .rmeta{color:var(--muted); font-size:12px; margin-top:2px;}
  .startbtn{background:var(--accent); color:#08131f; border:none; border-radius:10px;
    padding:10px 16px; font-weight:700; font-size:12.5px; white-space:nowrap; text-transform:uppercase; letter-spacing:.03em;}
  .startbtn:disabled{opacity:0.5;}

  .empty{color:var(--muted); text-align:center; padding:40px 20px; font-size:13.5px;}
  .loading{color:var(--muted); text-align:center; padding:40px 20px; font-size:13.5px;}

  .setup{padding:60px 24px; text-align:center;}
  .setup h2{font-size:18px; margin-bottom:8px; text-transform:none;}
  .setup p{color:var(--muted); font-size:14px; line-height:1.5;}
  .setup input{width:100%; padding:14px; margin-top:16px; border-radius:10px; border:1.5px solid var(--border);
    background:var(--card); color:var(--text); font-size:14px;}
  .setup button{width:100%; padding:16px; margin-top:12px; border-radius:10px; border:none;
    background:var(--accent); color:#08131f; font-weight:700; font-size:14.5px; text-transform:uppercase; letter-spacing:.03em; min-height:52px;}
  .setup .err{color:var(--danger); font-size:13px; margin-top:10px;}
  .setup .hint{font-size:12px; color:var(--muted); margin-top:18px; line-height:1.5; text-align:left;}

  .toolbar{position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; background:var(--card);
    border-top:1px solid var(--border); padding:10px 16px;
    display:flex; justify-content:center; gap:16px; z-index:20;}
  .toolbar button{background:none; border:none; color:var(--muted); font-size:11px; padding:6px 12px; text-transform:uppercase; letter-spacing:.03em; font-weight:700;}
  .toolbar button.reset{color:var(--danger);}
  .toolbar .resumebtn{flex:1; background:var(--accent); color:#08131f; border:none;
    border-radius:10px; padding:14px 16px; font-weight:700; font-size:13.5px; text-transform:uppercase; letter-spacing:.03em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* --- Active workout screen --- */
  .workout-header{position:sticky; top:0; z-index:10; background:rgba(21,24,27,0.95);
    backdrop-filter:blur(10px); padding:14px 16px; border-bottom:1px solid var(--border);
    display:flex; justify-content:space-between; align-items:center;}
  .workout-header .wname{font-weight:700; font-size:16px;}
  .workout-header .wtimer{color:var(--accent); font-size:12px; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums;}
  .workout-header .discardbtn{color:var(--danger); background:none; border:none; font-size:20px; padding:4px 8px;
    min-width:44px; height:44px;}
  .workout-header .backbtn{background:none; border:none; color:var(--text); font-size:26px;
    line-height:1; min-width:44px; height:44px; padding:0;}
  .workout-header .wtitle{flex:1; min-width:0;}

  .wex-card{background:var(--card); border:1px solid var(--border); border-radius:14px;
    margin:12px 16px; padding:16px; transition:border-color 0.2s;}
  .wex-card.done{border-color:rgba(79,176,255,0.4);}
  .wex-card .wex-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .wex-card .wex-move{display:flex; flex-direction:column; gap:4px;}
  .wex-card .movebtn{background:var(--card2); border:1px solid var(--border); color:var(--muted);
    border-radius:8px; width:26px; height:22px; font-size:11px; line-height:1; padding:0;}
  .wex-card .movebtn:disabled{opacity:0.25;}
  .wex-card .wex-titleblock{flex:1; min-width:0;}
  .wex-card .wex-name{font-weight:700; font-size:15px;}
  .wex-card .wex-target{color:var(--muted); font-size:12px; margin-top:2px;}
  .wex-card .removeexbtn{background:none; border:none; color:var(--danger); font-size:16px; padding:2px 4px; opacity:0.75;}
  .wex-card .wex-last{background:var(--card2); border-radius:10px; padding:8px 10px;
    margin-top:10px; font-size:12px; color:var(--muted);}
  .wex-card .wex-last b{color:var(--text);}

  .rest-timer{margin-top:8px; background:rgba(79,176,255,0.12); border:1px solid rgba(79,176,255,0.35);
    border-radius:10px; padding:7px 10px; font-size:12px; color:var(--accent); font-weight:700;
    display:flex; justify-content:space-between; align-items:center;}
  .rest-timer button{background:none; border:none; color:var(--accent); font-size:11px; font-weight:700;
    text-decoration:underline;}

  .settable{margin-top:10px; width:100%; border-collapse:collapse;}
  .settable th{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em;
    font-weight:700; padding:4px 4px; text-align:center;}
  .settable th:first-child{text-align:left;}
  .settable td{padding:3px 2px; text-align:center; vertical-align:middle;}
  .setrow .setnum{font-size:13px; font-weight:700; color:var(--muted); width:44px; white-space:nowrap; text-align:left; padding-left:2px;}
  .setrow .prevcell{font-size:11px; color:var(--muted); white-space:nowrap;}
  .setrow input{width:100%; background:var(--card2); border:1.5px solid var(--border); color:var(--text);
    border-radius:8px; padding:9px 4px; font-size:14px; text-align:center; min-width:0; font-variant-numeric:tabular-nums;}
  .setrow.logged input{background:rgba(79,176,255,0.08); border-color:rgba(79,176,255,0.3); color:var(--accent);}
  .setrow .actioncell{width:50px;}
  .setrow .logbtn{background:var(--card2); color:var(--muted); border:1.5px solid var(--border);
    border-radius:10px; width:44px; height:40px; font-weight:900; font-size:16px; padding:0;}
  .setrow.logged .logbtn{background:var(--accent); color:#08131f; border-color:var(--accent);}
  .setrow .delbtn{background:none; color:var(--muted); border:none; font-size:13px; width:26px; height:26px; padding:0; opacity:0.65; margin-left:2px; vertical-align:middle;}
  .setrow .delbtn:active{opacity:1; color:var(--danger);}

  .addsetbtn{margin-top:10px; width:100%; padding:11px; border-radius:10px; border:1.5px dashed var(--border);
    background:none; color:var(--muted); font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; min-height:44px;}

  .addexbtn{display:block; width:calc(100% - 32px); margin:12px 16px 0; padding:14px; border-radius:12px;
    border:1.5px dashed var(--accent); background:rgba(79,176,255,0.08); color:var(--accent);
    font-size:13.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;}

  .finish-bar{position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; background:var(--card);
    border-top:1px solid var(--border); padding:12px 16px; z-index:20;}
  .finish-bar button{width:100%; padding:16px; border-radius:10px; border:none;
    background:var(--accent); color:#08131f; font-weight:700; font-size:14.5px; text-transform:uppercase; letter-spacing:.03em; min-height:52px;}

  .overlay{position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:30;
    display:flex; align-items:flex-end; justify-content:center;}
  .overlay-sheet{background:var(--card); width:100%; max-width:480px; border-radius:16px 16px 0 0;
    padding:20px; max-height:78vh; overflow-y:auto; border-top:1px solid var(--border);}
  .overlay-sheet h3{margin:0 0 14px; font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700;}
  .overlay-sheet .opt{background:var(--card2); border-radius:10px; padding:14px; margin-bottom:8px;
    font-weight:600; border:1.5px solid var(--border);}
  .overlay-sheet .cancel{width:100%; padding:12px; margin-top:8px; background:none; border:none;
    color:var(--muted); font-size:14px;}

  /* --- Feedback: confetti + PR toast --- */
  .confetti-piece{position:fixed; z-index:60; border-radius:2px; pointer-events:none;
    animation-name:confettiBurst; animation-timing-function:cubic-bezier(.2,.8,.3,1); animation-fill-mode:forwards;}
  @keyframes confettiBurst{
    0%{ transform:translate(-50%,-50%) rotate(0deg) scale(1); opacity:1; }
    100%{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(0.6); opacity:0; }
  }
  .pr-toast{position:fixed; top:-120px; left:50%; transform:translateX(-50%); z-index:70;
    background:linear-gradient(135deg,var(--gold),var(--accent)); color:#08131f; font-weight:700; font-size:14px;
    padding:14px 22px; border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,0.45);
    transition:top 0.45s cubic-bezier(.34,1.56,.64,1); white-space:nowrap; text-align:center; text-transform:uppercase; letter-spacing:.03em;}
  .pr-toast.show{ top:18px; }
  .pr-toast .prsub{display:block; font-size:11px; font-weight:600; opacity:0.85; margin-top:2px; text-transform:none; letter-spacing:0;}
</style>
</head>
<body>
<div id="app">
  <header class="topbar" id="topHeader">
    <h1>🏋️ Gym Log</h1>
    <div class="sub" id="headerSub">syncing…</div>
  </header>
  <div id="content"></div>
</div>
<div class="toolbar" id="mainToolbar">
  <button onclick="location.reload()">↻ Refresh</button>
  <button class="reset" onclick="resetToken()">⎋ Change token</button>
</div>

<script>
const API = "https://wger.de/api/v2";
// SECURITY NOTE: this is a static, backend-less PWA, so there is nowhere else to keep
// the wger API token — it is stored in plaintext in localStorage and is readable by
// any script that runs on this page's origin. Keep this app free of third-party
// scripts/CDNs and untrusted dynamic HTML; if that ever changes, this token storage
// needs to be revisited (e.g. move to a small backend that proxies wger and issues
// short-lived session cookies instead).
const TOKEN_KEY = "wger_api_token";
const ACTIVE_KEY = "active_workout";
const EXINDEX_KEY = "exercise_index_v2";
const EXINDEX_TTL_MS = 7 * 24 * 60 * 60 * 1000;
let token = localStorage.getItem(TOKEN_KEY);
let exerciseCache = {};
try{
  exerciseCache = JSON.parse(localStorage.getItem("exercise_name_cache") || "{}");
}catch(e){
  // Corrupted cache should never take down the whole app — drop it and carry on.
  exerciseCache = {};
  localStorage.removeItem("exercise_name_cache");
}
let activeTab = "history";
let allLogsCache = null; // populated on normal render, used for "last time" lookups
let exerciseIndex = null; // [{id,name}], lazily built/cached for the exercise picker
let renderGeneration = 0; // bumped on every render() call; stale calls bail out instead of overwriting fresher state
let restTickInterval = null;
// ponytail: showMain is deliberately not persisted — a reload/relaunch mid-workout always
// lands back on the workout screen, never on the backed-out main view (Gate 1A).
let showMain = false; // true = user backed out of an active workout to browse
let audioCtx = null;
// ponytail: summary/summaryCard are deliberately not persisted — a reload during the
// summary lands on the main screen, which is fine: the workout is already saved by then.
let summary = null; // { durationMin, totals:{sets,reps,volume}, prs:[], muscles:[] }
let summaryCard = 0;

function saveExerciseCache(){ localStorage.setItem("exercise_name_cache", JSON.stringify(exerciseCache)); }
function getActive(){ try{ return JSON.parse(localStorage.getItem(ACTIVE_KEY) || "null"); }catch(e){ return null; } }
function setActive(w){ localStorage.setItem(ACTIVE_KEY, JSON.stringify(w)); }
function clearActive(){ localStorage.removeItem(ACTIVE_KEY); }

const REQUEST_TIMEOUT_MS = 20000;

// Wraps fetch with a timeout so a hung connection can't leave the UI stuck on
// "Loading…" forever with no way out.
function fetchWithTimeout(url, opts){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
  return fetch(url, Object.assign({}, opts||{}, { signal: controller.signal }))
    .catch(e => {
      if(e.name === "AbortError") throw new Error("timeout");
      throw e;
    })
    .finally(() => clearTimeout(timer));
}

async function apiRaw(path, opts){
  const res = await fetchWithTimeout(`${API}${path}`, Object.assign({
    headers: Object.assign({ "Authorization": `Token ${token}`, "Content-Type": "application/json" }, (opts&&opts.headers)||{})
  }, opts||{}));
  if(res.status === 401 || res.status === 403) throw new Error("auth");
  if(!res.ok){ const t = await res.text().catch(()=> ""); throw new Error("http_" + res.status + ":" + t.slice(0,200)); }
  if(res.status === 204) return null;
  return res.json();
}
async function api(path){ return apiRaw(path); }
async function apiPost(path, body){ return apiRaw(path, { method:"POST", body: JSON.stringify(body) }); }
async function apiPatch(path, body){ return apiRaw(path, { method:"PATCH", body: JSON.stringify(body) }); }
async function apiDelete(path){ return apiRaw(path, { method:"DELETE" }); }

async function apiAll(path){
  let results = [];
  let url = `${API}${path}`;
  while(url){
    const res = await fetchWithTimeout(url, { headers: { "Authorization": `Token ${token}` }});
    if(res.status === 401 || res.status === 403) throw new Error("auth");
    if(!res.ok) throw new Error("http_" + res.status);
    const data = await res.json();
    results = results.concat(data.results || []);
    url = data.next;
  }
  return results;
}

// Like Promise.all(items.map(fn)), but runs at most `limit` calls concurrently.
// Used for exercise-name lookups so a big history/routine doesn't fire dozens of
// simultaneous requests at the wger API.
async function mapWithConcurrency(items, limit, fn){
  const results = new Array(items.length);
  let next = 0;
  async function worker(){
    while(next < items.length){
      const i = next++;
      results[i] = await fn(items[i], i);
    }
  }
  const workers = Array.from({ length: Math.min(limit, items.length) }, worker);
  await Promise.all(workers);
  return results;
}

// Pulls the preferred (English, language id 2) translation name out of an
// exerciseinfo-shaped object's `translations` array, falling back to whatever's first.
function pickEnglishName(translations){
  let name = null;
  for(const t of (translations||[])){
    if(t.language === 2){ name = t.name; break; }
  }
  if(!name && translations && translations.length){ name = translations[0].name; }
  return name;
}

async function exerciseName(id){
  if(exerciseCache[id]) return exerciseCache[id];
  try{
    const info = await api(`/exerciseinfo/${id}/?format=json`);
    const name = pickEnglishName(info.translations) || `Exercise #${id}`;
    exerciseCache[id] = name;
    saveExerciseCache();
    return name;
  }catch(e){
    return `Exercise #${id}`;
  }
}

// Builds (or returns the cached) full {id,name} exercise list used by the "Add exercise"
// picker. wger's public search endpoints proved unreliable to target directly, so instead
// we pull the full exerciseinfo list once (~a handful of paginated requests) and filter
// client-side; the result is cached in localStorage for a week.
async function loadExerciseIndex(){
  if(exerciseIndex) return exerciseIndex;
  try{
    const cached = JSON.parse(localStorage.getItem(EXINDEX_KEY) || "null");
    if(cached && cached.ts && (Date.now() - cached.ts < EXINDEX_TTL_MS) && Array.isArray(cached.items) && cached.items.length){
      exerciseIndex = cached.items;
      return exerciseIndex;
    }
  }catch(e){ /* fall through to rebuild */ }

  const infos = await apiAll(`/exerciseinfo/?format=json&limit=200`);
  const items = [];
  for(const info of infos){
    const name = pickEnglishName(info.translations);
    if(!name) continue;
    items.push({ id: info.id, name, cat: (info.category && info.category.name) || "" });
    if(!exerciseCache[info.id]) exerciseCache[info.id] = name;
  }
  items.sort((a,b) => a.name.localeCompare(b.name));
  exerciseIndex = items;
  try{
    localStorage.setItem(EXINDEX_KEY, JSON.stringify({ ts: Date.now(), items }));
    localStorage.removeItem("exercise_index_v1");
  }catch(e){ /* storage full: cache just won't persist */ }
  saveExerciseCache();
  return items;
}

// Synchronous, never fetches — reads whatever index is already in memory/localStorage.
// Returns null when no index is available, which is the signal to drop the muscle card.
function exerciseCatMap(){
  let items = exerciseIndex;
  if(!items){
    try{
      const cached = JSON.parse(localStorage.getItem(EXINDEX_KEY) || "null");
      items = cached && Array.isArray(cached.items) ? cached.items : null;
    }catch(e){ items = null; }
  }
  if(!items) return null;
  const map = {};
  for(const it of items){ if(it.cat) map[it.id] = it.cat; }
  return map;
}

function esc(s){
  if(s === null || s === undefined) return "";
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}
function fmtDate(d){
  const dt = new Date(d);
  return dt.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
}
function daysAgo(dateStr){
  const d = new Date(dateStr);
  const now = new Date();
  return Math.floor((now - d) / 86400000);
}
function localDateISO(d = new Date()){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayISO(){ return localDateISO(); }
function nowTimeISO(){
  const d = new Date();
  return d.toTimeString().slice(0,8);
}
function dayKey(v){
  if(!v) return "";
  return v.length > 10 ? localDateISO(new Date(v)) : v.slice(0,10);
}
function compareSessionsDesc(a, b){
  const dk = dayKey(b.date).localeCompare(dayKey(a.date));
  if(dk) return dk;
  const ts = (b.time_start||"").localeCompare(a.time_start||"");
  if(ts) return ts;
  return (b.id||0) - (a.id||0);
}
function sortSessionsDesc(list){ return [...list].sort(compareSessionsDesc); }

function showSetup(errMsg){
  renderMainHeader();
  renderToolbar();
  document.getElementById("headerSub").textContent = "not connected";
  document.getElementById("content").innerHTML = `
    <div class="setup">
      <h2>Connect your wger account</h2>
      <p>Paste your wger API token below. It's stored only on this device (localStorage), never sent anywhere except wger.de.</p>
      <input id="tokenInput" type="password" placeholder="API token" autocomplete="off">
      <button onclick="connectToken()">Connect</button>
      ${errMsg ? `<div class="err">${errMsg}</div>` : ""}
      <div class="hint">
        Get your token: wger.de → Preferences → API token (or /api/v2/token in your account).
      </div>
    </div>`;
}

function connectToken(){
  const val = document.getElementById("tokenInput").value.trim();
  if(!val) return;
  localStorage.setItem(TOKEN_KEY, val);
  token = val;
  render();
}

function resetToken(){
  if(confirm("Disconnect this account and clear the saved token?")){
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem("exercise_name_cache");
    localStorage.removeItem(ACTIVE_KEY);
    localStorage.removeItem(EXINDEX_KEY);
    location.reload();
  }
}

    <div class="tab ${activeTab==='prs'?'active':''}" onclick="setTab('prs')">PRs</div>

  </div>`;
}

function renderMainHeader(){
  const header = document.getElementById("topHeader");

function backToMain(){ showMain = true; render(); }

function primeAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();
  }catch(e){ /* audio unavailable — set logging must still work */ }
}

// ponytail: no mute toggle — iOS ringer switch silences WebAudio, Android does not;
// add a persisted toggle only if it annoys.
function beep(freqs){
  try{
    if(!audioCtx) return;
    freqs.forEach((freq, i) => {
      const t0 = audioCtx.currentTime + i*0.07;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.linearRampToValueAtTime(0.25, t0 + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.07);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.07);
    });
  }catch(e){ /* audio unavailable — set logging must still work */ }
}

async function render(){
  if(!token){ showSetup(); return; }
  const active = getActive();
  if(active && !showMain){ renderActiveWorkout(); return; }

  const myGeneration = ++renderGeneration;

  renderMainHeader();
  renderToolbar();
  document.getElementById("content").innerHTML = tabsHtml() + `<div class="loading">Loading…</div>`;

  try{
    let [sessions, logs, routines] = await Promise.all([
      apiAll(`/workoutsession/?format=json&ordering=-date&limit=100`),
      apiAll(`/workoutlog/?format=json&ordering=-date&limit=500`),
      apiAll(`/routine/?format=json&is_template=false&limit=100`)
    ]);

    // A newer render() (e.g. from a fast tab switch or a manual refresh) started
    // and finished while we were awaiting the network — let it own the screen.
    if(myGeneration !== renderGeneration) return;

    sessions = sortSessionsDesc(sessions);
    allLogsCache = logs;

    document.getElementById("headerSub").textContent =
      sessions.length ? `${sessions.length} session${sessions.length===1?'':'s'} logged` : "connected";

    const routineById = {};
    routines.forEach(r => routineById[r.id] = r);

    const logsBySession = {};
    logs.forEach(l => {
      if(!logsBySession[l.session]) logsBySession[l.session] = [];
      logsBySession[l.session].push(l);
    });

    if(activeTab === "history"){
      await renderHistory(sessions, logsBySession, routineById);
    } else if(activeTab === "prs"){
      await renderPRs(logs);
    } else if(activeTab === "routines"){
      renderRoutines(routines);
    }
  }catch(e){
    if(myGeneration !== renderGeneration) return; // superseded by a newer render — don't show a stale error either
    if(e.message === "auth"){
      showSetup("Token rejected — check it's correct and try again.");
    } else {
      const msg = e.message === "timeout" ? "request timed out" : e.message;
      document.getElementById("content").innerHTML = tabsHtml() +
        `<div class="empty">Couldn't load data (${esc(msg)}). Pull to refresh or check your connection.</div>`;
    }
  }
}

async function renderHistory(sessions, logsBySession, routineById){
  const content = document.getElementById("content");
  if(!sessions.length){
    content.innerHTML = tabsHtml() + `<div class="empty">No workouts logged yet.<br>Tap Routines → Start to log your first one.</div>`;
    return;
  }

  const totalSessions = sessions.length;
  const last7 = sessions.filter(s => daysAgo(s.date) <= 7).length;
  const uniqueDates = [...new Set(sessions.map(s=>s.date))];
  let streak = 0;
  let checkDate = new Date();
  checkDate.setHours(0,0,0,0);
  const dateSet = new Set(uniqueDates);
  for(let i=0;i<400;i++){
    const iso = localDateISO(checkDate);
    if(dateSet.has(iso)){ streak++; checkDate.setDate(checkDate.getDate()-1); }
    else if(i===0){ checkDate.setDate(checkDate.getDate()-1); continue; }
    else break;
  }

  let html = tabsHtml();
  html += `<div class="stats-row">
    <div class="stat"><div class="num">${totalSessions}</div><div class="lbl">Total</div></div>
    <div class="stat"><div class="num">${last7}</div><div class="lbl">Last 7d</div></div>
    <div class="stat"><div class="num">${streak}</div><div class="lbl">Streak</div></div>
  </div>`;

  html += `<section><h2>Recent Sessions</h2><div id="sessionList"></div></section>`;
  content.innerHTML = html;

  const listEl = document.getElementById("sessionList");
  for(const s of sessions.slice(0, 30)){
    const sLogs = logsBySession[s.id] || [];
    const routine = routineById[s.routine];
    const exGroups = {};
    for(const l of sLogs){
      if(!exGroups[l.exercise]) exGroups[l.exercise] = [];
      exGroups[l.exercise].push(l);
    }
    const exIds = Object.keys(exGroups);
    const names = await mapWithConcurrency(exIds, 5, id => exerciseName(id));

    let exHtml = "";
    exIds.forEach((id, i) => {
      const sets = exGroups[id];
      const setStr = sets.map(x => `${parseFloat(x.weight||0)}kg×${parseFloat(x.repetitions||0)}`).join(", ");
      exHtml += `<div class="exrow">
        <div><div class="exname">${esc(names[i])}</div><div class="exsets">${esc(setStr)}</div></div>
        <div class="pill">${sets.length} set${sets.length===1?'':'s'}</div>
      </div>`;
    });
    if(!exHtml) exHtml = `<div class="exrow"><div class="exname" style="color:var(--muted)">No sets logged for this session</div></div>`;

    const card = document.createElement("div");
    card.className = "session-card";
    card.innerHTML = `
      <div class="row-top">
        <div class="routine-name">${routine ? esc(routine.name) : "Workout"}</div>
        <div class="date">${fmtDate(s.date)}</div>
      </div>
      <div class="meta">${exIds.length} exercise${exIds.length===1?'':'s'}${s.impression ? " · felt " + ({1:"bad",2:"ok",3:"good"}[s.impression]||"") : ""}</div>
      <div class="exlist">${exHtml}</div>
    `;
    listEl.appendChild(card);
  }
}

async function renderPRs(logs){
  const content = document.getElementById("content");
  if(!logs.length){
    content.innerHTML = tabsHtml() + `<div class="empty">No sets logged yet — PRs will show up once you have data.</div>`;
    return;
  }
  const bestByExercise = {};
  for(const l of logs){
    const w = parseFloat(l.weight || 0);
    if(w <= 0) continue;
    const cur = bestByExercise[l.exercise];
    if(!cur || w > cur.weight){
      bestByExercise[l.exercise] = { weight: w, reps: parseFloat(l.repetitions||0), date: l.date };
    }
  }
  const exIds = Object.keys(bestByExercise);
  if(!exIds.length){
    document.getElementById("content").innerHTML = tabsHtml() + `<div class="empty">No weighted sets logged yet.</div>`;
    return;
  }
  const names = await mapWithConcurrency(exIds, 5, id => exerciseName(id));
  const rows = exIds.map((id,i) => ({ name: names[i], ...bestByExercise[id] }))
    .sort((a,b) => b.weight - a.weight);

  let html = tabsHtml() + `<section><h2>Personal Records</h2>`;
  for(const r of rows){
    html += `<div class="pr-card">
      <div><div class="exname">${esc(r.name)}</div><div class="prdate">${fmtDate(r.date)}</div></div>
      <div class="prval">${r.weight}kg × ${r.reps}</div>
    </div>`;
  }
  html += `</section>`;
  document.getElementById("content").innerHTML = html;
}

function renderRoutines(routines){
  const content = document.getElementById("content");
  if(!routines.length){
    content.innerHTML = tabsHtml() + `<div class="empty">No routines found.</div>`;
    return;
  }
  let html = tabsHtml() + `<section><h2>Your Routines</h2>`;
  const sorted = [...routines].sort((a,b) => new Date(b.created) - new Date(a.created));
  for(const r of sorted){
    html += `<div class="routine-card">
      <div class="rtop">
        <div>
          <div class="rname">${esc(r.name)}</div>
          <div class="rmeta">${esc(r.start)} → ${esc(r.end)}${r.description ? " · " + esc(r.description) : ""}</div>
        </div>
        <button class="startbtn" onclick="startWorkout(${r.id})">▶ Start</button>
      </div>
    </div>`;
  }
  html += `</section>`;
  content.innerHTML = html;
}

// ---------- ACTIVE WORKOUT ----------
// An active workout's `entries` is an array of exercises, in display order. Each entry
// has a `sets` array (one item per row); this replaces the old setCount+loggedByRow model
// so that removing a set, removing a whole exercise, and reordering exercises are all
// simple array operations that stay in sync with what's rendered.
//   entry = { slotEntryId, exerciseId, name, restSeconds, restEndMs, lastTime, sets }
//   set   = { weight, reps, logged, logId }
// slotEntryId is null for exercises added ad hoc mid-workout (not part of the routine's
// structure) — wger's WorkoutLog.slot_entry is optional, so these log normally.

function parseConfigValue(configArr, fallback){
  if(configArr && configArr.length) return parseFloat(configArr[0].value);
  return fallback;
}

// Returns { [exerciseId]: { w, v } } — w is the heaviest single-set weight ever
// logged, v the heaviest single-set volume (weight*reps) ever logged, tracked
// independently since the heaviest-weight set and highest-volume set usually differ.
function computeBestByExercise(logs){
  const m = {};
  for(const l of (logs||[])){
    const w = parseFloat(l.weight || 0);
    if(w <= 0) continue;
    const reps = parseFloat(l.repetitions ?? l.reps ?? 0);
    const v = w * reps;
    const cur = m[l.exercise] || { w: 0, v: 0 };
    m[l.exercise] = { w: Math.max(cur.w, w), v: Math.max(cur.v, v) };
  }
  return m;
}

// prev is the {w,v} best record for this exercise, or undefined (first-ever set).
// Strictly-greater on each track, independent of each other.
function classifySetPR(prev, weight, reps){
  if(!prev) return { weightPR:false, volumePR:false };
  return { weightPR: weight > prev.w, volumePR: (weight*reps) > prev.v };
}

// Reduce over entries[].sets, counting only logged sets. Never produces NaN.
function summaryTotals(entries){
  let sets = 0, reps = 0, volume = 0;
  for(const entry of (entries||[])){
    for(const s of (entry.sets||[])){
      if(!s.logged) continue;
      const w = +s.weight || 0, r = +s.reps || 0;
      sets++; reps += r; volume += w*r;
    }
  }
  return { sets, reps, volume };
}

function lastTimeForExercise(exerciseId, logs){
  // ponytail: only the last 500 fetched logs are searched (see the `limit=500` fetches);
  // an exercise not performed within that window shows a blank Previous column — widen the
  // fetch window if this bites.
  const exLogs = (logs||[]).filter(l => l.exercise === exerciseId)
    .slice().sort(compareSessionsDesc);
  if(!exLogs.length) return [];
  const mostRecentDay = dayKey(exLogs[0].date);
  return exLogs.filter(l => dayKey(l.date) === mostRecentDay)
    .sort((a,b)=>a.id-b.id)
    .map(l => ({ weight: parseFloat(l.weight||0), reps: parseFloat(l.repetitions||0) }));
}

async function buildEntriesFromDay(day, allLogs){
  // flatten slots -> entries, in order
  const flat = [];
  for(const slot of (day.slots||[]).sort((a,b)=>a.order-b.order)){
    for(const entry of (slot.entries||[]).sort((a,b)=>a.order-b.order)){
      const restSeconds = parseConfigValue(entry.rest_configs, 90);
      const setNrTarget = parseConfigValue(entry.set_nr_configs, 3);
      flat.push({ slotEntryId: entry.id, exerciseId: entry.exercise, restSeconds, setNrTarget });
    }
  }
  const names = await mapWithConcurrency(flat, 5, e => exerciseName(e.exerciseId));

  return flat.map((f, i) => {
    const lastTime = lastTimeForExercise(f.exerciseId, allLogs);
    const setCount = Math.max(1, Math.round(f.setNrTarget || 3));
    const sets = [];
    for(let si=0; si<setCount; si++){
      const suggest = lastTime[si] || lastTime[0] || null;
      sets.push({ weight: suggest ? suggest.weight : "", reps: suggest ? suggest.reps : "", logged:false, logId:null });
    }
    return {
      slotEntryId: f.slotEntryId,
      exerciseId: f.exerciseId,
      name: names[i],
      restSeconds: f.restSeconds || 90,
      restEndMs: null,
      lastTime,
      sets
    };
  });
}

async function startWorkout(routineId){
  if(getActive()){ renderActiveWorkout(); return; }
  document.getElementById("content").innerHTML = `<div class="loading">Setting up workout…</div>`;
  try{
    const structure = await api(`/routine/${routineId}/structure/?format=json`);
    const nonRestDays = (structure.days||[]).filter(d => !d.is_rest && (d.slots||[]).length);
    if(!nonRestDays.length){ alert("This routine has no exercises configured."); render(); return; }
    if(nonRestDays.length === 1){
      await launchDay(structure, nonRestDays[0]);
    } else {
      showDayPicker(structure, nonRestDays);
    }
  }catch(e){
    alert("Couldn't load routine: " + e.message);
    render();
  }
}

function showDayPicker(structure, days){
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `<div class="overlay-sheet">
    <h3>Which day?</h3>
    ${days.map((d,i) => `<div class="opt" data-i="${i}">${esc(d.name)}</div>`).join("")}
    <button class="cancel" id="dpCancel">Cancel</button>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelectorAll(".opt").forEach(el => {
    el.onclick = async () => {
      const day = days[parseInt(el.dataset.i)];
      document.body.removeChild(overlay);
      await launchDay(structure, day);
    };
  });
  document.getElementById("dpCancel").onclick = () => document.body.removeChild(overlay);
}

async function launchDay(structure, day){
  document.getElementById("content").innerHTML = `<div class="loading">Setting up workout…</div>`;
  try{
    const logs = allLogsCache || await apiAll(`/workoutlog/?format=json&ordering=-date&limit=500`);
    allLogsCache = logs;
    const entries = await buildEntriesFromDay(day, logs);

    const session = await apiPost(`/workoutsession/?format=json`, {
      routine: structure.id,
      day: day.id,
      date: todayISO(),
      time_start: nowTimeISO()
    });

    const w = {
      sessionId: session.id,
      routineId: structure.id,
      routineName: structure.name,
      dayId: day.id,
      dayName: day.name || structure.name,
      startedAtMs: Date.now(),
      entries,
      best: computeBestByExercise(logs), // exerciseId -> {w,v} best ever logged, updated live as PRs happen
      prs: []
    };
    setActive(w);
    loadExerciseIndex().catch(() => {}); // fire-and-forget warm-up so the muscle card is ready at finish
    renderActiveWorkout();
  }catch(e){
    if(String(e.message).includes("500") || String(e.message).toLowerCase().includes("unique")){
      alert("You already have an unfinished session today for this routine (started elsewhere, like the wger app). Finish or delete that session first, then start again here.");
    } else {
      alert("Couldn't start workout: " + e.message);
    }
    render();
  }
}

function fmtRest(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return m>0 ? `${m}min ${s}s` : `${s}s`;
}

function renderActiveWorkout(){
  const w = getActive();
  if(!w){ render(); return; }
  // ponytail: re-deriving from allLogsCache mid-workout folds this session's own already-
  // POSTed sets into the "best ever" baseline, so a workout in flight across this upgrade
  // loses PR detection for its remaining sets. One-time, self-healing next workout.
  if(!w.best) w.best = computeBestByExercise(allLogsCache || []); // migrate pre-Phase-3 workouts
  showMain = false;

  document.getElementById("mainToolbar").style.display = "none";
  const topHeader = document.getElementById("topHeader");
  topHeader.className = "workout-header";
  topHeader.innerHTML = `
    <button class="backbtn" onclick="backToMain()">‹</button>
    <div class="wtitle">
      <div class="wname">${esc(w.dayName)}</div>
      <div class="wtimer" id="wtimer">0 min</div>
    </div>
    <button class="discardbtn" onclick="discardWorkout()">✕</button>
  `;

  let html = "";
  w.entries.forEach((entry, idx) => {
    const doneCount = entry.sets.filter(s => s.logged).length;
    const isDone = entry.sets.length > 0 && doneCount === entry.sets.length;

    let rowsHtml = "";
    entry.sets.forEach((s, si) => {
      const prev = entry.lastTime[si];
      const prevStr = prev ? `${prev.weight}kg×${prev.reps}` : "—";
      if(s.logged){
        rowsHtml += `<tr class="setrow logged">
          <td class="setnum">${si+1}<button class="delbtn" onclick="removeSetRow(${idx},${si})">✕</button></td>
          <td class="prevcell">${prevStr}</td>
          <td><input value="${s.weight}" disabled></td>
          <td><input value="${s.reps}" disabled></td>
          <td class="actioncell">
            <button class="logbtn" onclick="unlogSet(${idx},${si})">✓</button>
          </td>
        </tr>`;
      } else {
        const suggestWeight = s.weight;
        const suggestReps = s.reps;
        rowsHtml += `<tr class="setrow">
          <td class="setnum">${si+1}<button class="delbtn" onclick="removeSetRow(${idx},${si})">✕</button></td>
          <td class="prevcell">${prevStr}</td>
          <td><input type="number" inputmode="decimal" id="w_${idx}_${si}" placeholder="${suggestWeight||'kg'}" value="${suggestWeight||''}"></td>
          <td><input type="number" inputmode="decimal" id="r_${idx}_${si}" placeholder="${suggestReps||'reps'}" value="${suggestReps||''}"></td>
          <td class="actioncell">
            <button class="logbtn" onclick="logSet(${idx},${si})">✓</button>
          </td>
        </tr>`;
      }
    });

    const remaining = entry.restEndMs ? Math.max(0, Math.ceil((entry.restEndMs - Date.now())/1000)) : 0;
    const restHtml = remaining > 0
      ? `<div class="rest-timer" id="rest_${idx}" data-end="${entry.restEndMs}">
           <span>Rest: <span id="restsec_${idx}">${fmtRest(remaining)}</span></span>
           <button onclick="skipRest(${idx})">Skip</button>
         </div>`
      : "";

    html += `<div class="wex-card ${isDone?'done':''}">
      <div class="wex-top">
        <div class="wex-move">
          <button class="movebtn" onclick="moveExercise(${idx},-1)" ${idx===0?'disabled':''} title="Move up">▲</button>
          <button class="movebtn" onclick="moveExercise(${idx},1)" ${idx===w.entries.length-1?'disabled':''} title="Move down">▼</button>
        </div>
        <div class="wex-titleblock">
          <div class="wex-name">${esc(entry.name)}</div>
          <div class="wex-target">Target: ${entry.sets.length} sets · Rest ${fmtRest(entry.restSeconds)} · ${doneCount}/${entry.sets.length} done</div>
        </div>
        <button class="removeexbtn" onclick="removeExercise(${idx})" title="Remove exercise">🗑</button>
      </div>
      <div class="wex-last">Last time: <b>${entry.lastTime.length ? entry.lastTime.map(s=>`${s.weight}kg×${s.reps}`).join(", ") : "No previous data"}</b></div>
      ${restHtml}
      <table class="settable">
        <thead><tr><th>Set</th><th>Previous</th><th>Kg</th><th>Reps</th><th></th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
      <button class="addsetbtn" onclick="addSetRow(${idx})">+ Add Set</button>
    </div>`;
  });

  html += `<button class="addexbtn" onclick="openAddExercise()">+ Add Exercise</button>`;
  html += `<div style="height:80px"></div>`;
  document.getElementById("content").innerHTML = html;

  const finishBar = document.getElementById("finishBar");
  if(!finishBar){
    const bar = document.createElement("div");
    bar.className = "finish-bar";
    bar.id = "finishBar";
    bar.innerHTML = `<button onclick="finishWorkout()">Finish Workout</button>`;
    document.body.appendChild(bar);
  }

  updateTimer();

  if(restTickInterval) clearInterval(restTickInterval);
  restTickInterval = setInterval(tickRestTimers, 1000);
}

function updateTimer(){
  const w = getActive();
  if(!w) return;
  const mins = Math.max(0, Math.floor((Date.now() - w.startedAtMs) / 60000));
  const el = document.getElementById("wtimer");
  if(el) el.textContent = `${mins} min elapsed`;
  const rm = document.getElementById("resumeMins");
  if(rm) rm.textContent = mins;
}

function tickRestTimers(){
  const w = getActive();
  if(!w) return;
  updateTimer();
  w.entries.forEach((entry, idx) => {
    const box = document.getElementById(`rest_${idx}`);
    if(!entry.restEndMs){ if(box) box.remove(); return; }
    const remaining = Math.max(0, Math.ceil((entry.restEndMs - Date.now())/1000));
    if(remaining <= 0){
      entry.restEndMs = null;
      setActive(w);
      if(box) box.remove();
      return;
    }
    const secEl = document.getElementById(`restsec_${idx}`);
    if(secEl) secEl.textContent = fmtRest(remaining);
  });
}

function addSetRow(idx){
  const w = getActive();
  if(!w) return;
  const entry = w.entries[idx];
  const last = entry.sets[entry.sets.length - 1];
  entry.sets.push({ weight: last ? last.weight : "", reps: last ? last.reps : "", logged:false, logId:null });
  setActive(w);
  renderActiveWorkout();
}

async function removeSetRow(idx, si){
  const w = getActive();
  if(!w) return;
  const entry = w.entries[idx];
  const set = entry.sets[si];
  if(entry.sets.length <= 1){
    alert("Each exercise needs at least one set — remove the whole exercise instead if you don't want it in this workout.");
    return;
  }
  if(set.logged){
    if(!confirm("Delete this logged set? This removes it from wger.")) return;
    try{
      await apiDelete(`/workoutlog/${set.logId}/`);
    }catch(e){
      alert("Couldn't delete: " + e.message);
      return;
    }
  }
  entry.sets.splice(si, 1);
  setActive(w);
  renderActiveWorkout();
}

function moveExercise(idx, dir){
  const w = getActive();
  if(!w) return;
  const j = idx + dir;
  if(j < 0 || j >= w.entries.length) return;
  const tmp = w.entries[idx];
  w.entries[idx] = w.entries[j];
  w.entries[j] = tmp;
  setActive(w);
  renderActiveWorkout();
}

async function removeExercise(idx){
  const w = getActive();
  if(!w) return;
  const entry = w.entries[idx];
  const loggedSets = entry.sets.filter(s => s.logged);
  const msg = loggedSets.length
    ? `Remove ${entry.name}? This will also delete ${loggedSets.length} logged set${loggedSets.length===1?'':'s'} from wger.`
    : `Remove ${entry.name} from this workout?`;
  if(!confirm(msg)) return;
  for(const s of loggedSets){
    try{ await apiDelete(`/workoutlog/${s.logId}/`); }catch(e){ /* best effort — surfaced nowhere, matches discardWorkout's tolerance */ }
  }
  w.entries.splice(idx, 1);
  setActive(w);
  renderActiveWorkout();
}

async function openAddExercise(){
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `<div class="overlay-sheet">
    <h3>Add exercise</h3>
    <input id="exSearchInput" type="text" placeholder="Search exercises…"
      style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); background:var(--card2); color:var(--text); font-size:14px; margin-bottom:10px;">
    <div id="exResults"><div class="empty" style="padding:20px;">Loading exercises…</div></div>
    <button class="cancel" id="exCancel">Cancel</button>
  </div>`;
  document.body.appendChild(overlay);
  document.getElementById("exCancel").onclick = () => { if(overlay.parentNode) document.body.removeChild(overlay); };

  const resultsEl = document.getElementById("exResults");
  let items = [];
  try{
    items = await loadExerciseIndex();
  }catch(e){
    resultsEl.innerHTML = `<div class="empty">Couldn't load exercise list (${esc(e.message)}). Check your connection and try again.</div>`;
    return;
  }

  function renderResults(filter){
    const f = filter.trim().toLowerCase();
    const matches = (f ? items.filter(x => x.name.toLowerCase().includes(f)) : items).slice(0, 60);
    if(!matches.length){ resultsEl.innerHTML = `<div class="empty" style="padding:20px;">No matches.</div>`; return; }
    resultsEl.innerHTML = matches.map(x => `<div class="opt" data-id="${x.id}">${esc(x.name)}</div>`).join("");
    resultsEl.querySelectorAll(".opt").forEach(el => {
      el.onclick = () => {
        const id = parseInt(el.dataset.id, 10);
        const item = items.find(x => x.id === id);
        if(overlay.parentNode) document.body.removeChild(overlay);
        addExerciseToWorkout(id, item ? item.name : `Exercise #${id}`);
      };
    });
  }
  renderResults("");
  const input = document.getElementById("exSearchInput");
  input.addEventListener("input", () => renderResults(input.value));
  input.focus();
}

function addExerciseToWorkout(id, name){
  const w = getActive();
  if(!w) return;
  const lastTime = lastTimeForExercise(id, allLogsCache || []);
  const suggest = lastTime[0] || null;
  w.entries.push({
    slotEntryId: null, // not part of the routine's structure — logs fine, wger's slot_entry link is optional
    exerciseId: id,
    name,
    restSeconds: 90,
    restEndMs: null,
    lastTime,
    sets: [{ weight: suggest ? suggest.weight : "", reps: suggest ? suggest.reps : "", logged:false, logId:null }]
  });
  setActive(w);
  renderActiveWorkout();
}

function skipRest(idx){
  const w = getActive();
  if(!w) return;
  w.entries[idx].restEndMs = null;
  setActive(w);
  renderActiveWorkout();
}

// ---------- Feedback: vibration + confetti + PR celebration ----------

function vibrate(pattern){
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){ /* unsupported — no-op */ }
}

function spawnConfetti(x, y, count, colors, big){
  for(let i=0;i<count;i++){
    const el = document.createElement("div");
    el.className = "confetti-piece";
    const angle = Math.random() * Math.PI * 2;
    const dist = big ? (90 + Math.random()*150) : (40 + Math.random()*70);
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist - (big ? 50 : 15); // slight upward bias so it feels like a "pop"
    const rot = (Math.random()*720 - 360) + "deg";
    const size = big ? (7 + Math.random()*9) : (5 + Math.random()*5);
    const color = colors[Math.floor(Math.random()*colors.length)];
    el.style.cssText = `left:${x}px; top:${y}px; --dx:${dx}px; --dy:${dy}px; --rot:${rot}; width:${size}px; height:${size}px; background:${color}; animation-duration:${big?1.15:0.7}s;`;
    document.body.appendChild(el);
    const cleanup = () => { if(el.parentNode) el.parentNode.removeChild(el); };
    el.addEventListener("animationend", cleanup);
    setTimeout(cleanup, 1600); // fallback in case animationend doesn't fire
  }
}

// Upserts one record per exerciseId into w.prs, overwriting only the track(s) that
// fired this set — a later set on one track must not clobber an earlier hit on the other.
function recordPR(w, entry, weight, reps, prev, pr){
  let rec = w.prs.find(r => r.exerciseId === entry.exerciseId);
  if(!rec){
    rec = { exerciseId: entry.exerciseId, name: entry.name, weightPR: null, volumePR: null };
    w.prs.push(rec);
  }
  rec.name = entry.name;
  if(pr.weightPR) rec.weightPR = { weight, reps, prev: prev ? prev.w : null };
  if(pr.volumePR) rec.volumePR = { weight, reps, volume: weight*reps, prev: prev ? prev.v : null };
}

// ponytail: kg is hardcoded throughout (renderPRs, here, the summary) — wger's weight_unit
// is ignored; add real unit handling only if a lb user actually shows up.
function showPRToast(name, label, detail){
  const el = document.createElement("div");
  el.className = "pr-toast";
  el.innerHTML = `🏆 ${label}! <span class="prsub">${esc(name)} — ${detail}</span>`;
  document.body.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("show")));
  setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => { if(el.parentNode) el.parentNode.removeChild(el); }, 500);
  }, 2600);
}

// Standard tier: quick buzz + a small confetti pop, for every logged set.
// PR tier (isPR=true): longer celebratory buzz pattern, a much bigger confetti burst,
// and a banner sliding down from the top — for beating a previous best weight and/or
// single-set volume (weight x reps), tracked independently.
function triggerSetFeedback(isPR, x, y, name, label, detail){
  if(isPR){
    vibrate([50,40,50,40,150]);
    beep([880,1175,1568]);
    spawnConfetti(x, y, 40, ["#f2c14e","#4fb0ff","#ff6b5e","#e4e8eb"], true);
    showPRToast(name, label, detail);
  } else {
    vibrate(35);
    beep([880]);
    spawnConfetti(x, y, 14, ["#4fb0ff","#f2c14e"], false);
  }
}

async function logSet(idx, si){
  primeAudio();
  const w = getActive();
  if(!w) return;
  const entry = w.entries[idx];
  const set = entry.sets[si];
  const weightInput = document.getElementById(`w_${idx}_${si}`);
  const repsInput = document.getElementById(`r_${idx}_${si}`);
  const weightVal = parseFloat(weightInput.value);
  const repsVal = parseFloat(repsInput.value);
  if(isNaN(weightVal) || isNaN(repsVal)){ alert("Enter weight and reps"); return; }
  if(weightVal < 0 || repsVal < 0){ alert("Weight and reps can't be negative"); return; }

  // Capture the button's screen position before the DOM gets rebuilt, so the celebration
  // can burst from where the user actually tapped.
  const anchorRect = repsInput.getBoundingClientRect();
  const originX = anchorRect.left + anchorRect.width/2;
  const originY = anchorRect.top + anchorRect.height/2;

  try{
    const log = await apiPost(`/workoutlog/?format=json`, {
      session: w.sessionId,
      routine: w.routineId,
      exercise: entry.exerciseId,
      slot_entry: entry.slotEntryId || undefined,
      weight: weightVal,
      repetitions: repsVal,
      date: new Date().toISOString()
    });
    set.logged = true;
    set.logId = log.id;
    set.weight = weightVal;
    set.reps = repsVal;
    entry.restEndMs = Date.now() + (entry.restSeconds*1000);

    const prev = w.best[entry.exerciseId];
    const pr = classifySetPR(prev, weightVal, repsVal);
    const isPR = pr.weightPR || pr.volumePR;
    w.best[entry.exerciseId] = {
      w: Math.max(weightVal, prev ? prev.w : 0),
      v: Math.max(weightVal * repsVal, prev ? prev.v : 0)
    };
    let label = "", detail = "";
    if(isPR){
      recordPR(w, entry, weightVal, repsVal, prev, pr);
      if(pr.weightPR && pr.volumePR){
        label = "Weight + Volume PR";
        detail = `${weightVal}kg × ${repsVal}`;
      } else if(pr.weightPR){
        label = "Weight PR";
        detail = `${weightVal}kg${prev ? ` (was ${prev.w}kg)` : ""}`;
      } else {
        label = "Volume PR";
        const vol = weightVal * repsVal;
        detail = `${weightVal}kg × ${repsVal} = ${vol}kg${prev ? ` (was ${prev.v}kg)` : ""}`;
      }
    }

    setActive(w);
    renderActiveWorkout();
    triggerSetFeedback(isPR, originX, originY, entry.name, label, detail);
  }catch(e){
    alert("Couldn't log set: " + e.message);
  }
}

async function unlogSet(idx, si){
  const w = getActive();
  if(!w) return;
  const entry = w.entries[idx];
  const set = entry.sets[si];
  if(!set.logged) return;
  if(!confirm("Unmark this set as logged? (the row stays so you can re-enter it; use ✕ to remove the row entirely)")) return;
  try{
    await apiDelete(`/workoutlog/${set.logId}/`);
    set.logged = false;
    set.logId = null;
    setActive(w);
    renderActiveWorkout();
  }catch(e){
    alert("Couldn't delete: " + e.message);
  }
}

// ponytail: category granularity only (Chest/Back/Legs...), not per-muscle — upgrade if
// this card proves too coarse.
function buildSummary(w){
  const durationMin = Math.max(0, Math.floor((Date.now() - w.startedAtMs) / 60000));
  const totals = summaryTotals(w.entries);
  const prs = w.prs || [];
  const catMap = exerciseCatMap();
  const muscleTally = {};
  if(catMap){
    for(const entry of w.entries){
      const cat = catMap[entry.exerciseId];
      if(!cat) continue;
      const loggedCount = entry.sets.filter(s => s.logged).length;
      if(loggedCount > 0) muscleTally[cat] = (muscleTally[cat] || 0) + loggedCount;
    }
  }
  const muscles = Object.entries(muscleTally).map(([cat,sets]) => ({cat,sets})).sort((a,b)=>b.sets-a.sets);
  return { durationMin, totals, prs, muscles };
}

function summaryCards(){
  const cards = ["volume", "prs"];
  if(summary.muscles.length > 0) cards.push("muscles");
  return cards;
}

function renderSummary(){
  document.getElementById("mainToolbar").style.display = "none";
  renderMainHeader();
  const cards = summaryCards();
  const card = cards[summaryCard];
  const isLast = summaryCard === cards.length - 1;

  let body = "";
  if(card === "volume"){
    body = `<div class="summary-hero">${summary.totals.volume}kg</div>
      <div class="summary-sub">${summary.totals.sets} sets · ${summary.totals.reps} reps · ${summary.durationMin} min</div>`;
  } else if(card === "prs"){
    if(!summary.prs.length){
      body = `<div class="summary-sub">No PRs this time — still counts.</div>`;
    } else {
      body = summary.prs.map(r => {
        let badges = "";
        let figures = "";
        if(r.weightPR){ badges += `<span class="pr-badge">Weight PR</span>`; figures += `${r.weightPR.weight}kg × ${r.weightPR.reps}`; }
        if(r.volumePR){ badges += `<span class="pr-badge">Volume PR</span>`; figures += (figures?" · ":"") + `${r.volumePR.volume}kg vol`; }
        return `<div class="pr-card">
          <div><div class="exname">${esc(r.name)}${badges}</div><div class="prdate">${figures}</div></div>
        </div>`;
      }).join("");
    }
  } else if(card === "muscles"){
    body = summary.muscles.map(m => `<div class="muscle-row"><span>${esc(m.cat)}</span><span>${m.sets} sets</span></div>`).join("");
  }

  const dots = cards.map((c,i) => `<span class="dot ${i===summaryCard?'active':''}"></span>`).join("");

  document.getElementById("content").innerHTML = `
    <div class="summary-card" onclick="nextSummaryCard()">
      ${body}
      <div class="summary-dots">${dots}</div>
      <button class="donebtn" onclick="event.stopPropagation(); nextSummaryCard()">${isLast ? "Done" : "Next"}</button>
    </div>`;
}

function nextSummaryCard(){
  const cards = summaryCards();
  if(summaryCard >= cards.length - 1){ closeSummary(); return; }
  summaryCard++;
  renderSummary();
}

function closeSummary(){
  summary = null;
  summaryCard = 0;
  render();
}

async function finishWorkout(){
  const w = getActive();
  if(!w) return;
  const totalSets = w.entries.reduce((sum,e) => sum + e.sets.filter(s => s.logged).length, 0);
  if(!confirm(`Finish workout? ${totalSets} set${totalSets===1?'':'s'} logged.`)) return;
  try{
    // ponytail: cross-midnight sessions (start before, end after local midnight) store
    // time_end < time_start — wger has no way to represent that; not fixed here.
    await apiPatch(`/workoutsession/${w.sessionId}/`, { time_end: nowTimeISO() });
  }catch(e){
    // Your logged sets are already saved server-side (each one was its own POST), so this
    // is safe to continue past — but the session's end time won't be recorded, so say so.
    alert("Workout saved, but couldn't record the finish time (" + e.message + "). Your logged sets are safe.");
  }
  const s = buildSummary(w); // before clearActive() — needs w.entries/best/prs still intact
  clearActive();
  if(restTickInterval) clearInterval(restTickInterval);
  const bar = document.getElementById("finishBar");
  if(bar) bar.remove();
  activeTab = "history";
  if(s.totals.sets === 0){ render(); return; }
  summary = s; summaryCard = 0;
  renderSummary();
}

async function discardWorkout(){
  const w = getActive();
  if(!w) return;
  if(!confirm("Discard this workout? Logged sets will be deleted.")) return;
  let failures = 0;
  for(const entry of w.entries){
    for(const s of entry.sets){
      if(!s.logged) continue;
      try{
        await apiDelete(`/workoutlog/${s.logId}/`);
      }catch(e){ failures++; }
    }
  }
  let sessionDeleted = true;
  try{
    await apiDelete(`/workoutsession/${w.sessionId}/`);
  }catch(e){ sessionDeleted = false; }
  clearActive();
  if(restTickInterval) clearInterval(restTickInterval);
  const bar = document.getElementById("finishBar");
  if(bar) bar.remove();
  if(failures > 0 || !sessionDeleted){
    alert(
      "Workout discarded locally, but cleanup on the server was incomplete " +
      `(${failures} set${failures===1?'':'s'} and ${sessionDeleted ? "no" : "the"} session ` +
      "couldn't be deleted). You may want to remove leftover entries from wger directly."
    );
  }
  render();
}

document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && getActive()) updateTimer();
});
window.addEventListener("pageshow", () => { if(getActive()) updateTimer(); });

function runSelfTest(){
  let checks = 0, failed = 0;
  function assert(cond, label){
    checks++;
    if(!cond){ failed++; console.assert(false, label); }
  }

  assert(localDateISO(new Date(2026,0,5,0,30)) === "2026-01-05", "localDateISO zero-pad / no roll-forward");
  {
    const d = new Date(2026,5,15,0,0,0,0); // local midnight
    assert(localDateISO(d) === "2026-06-15", "localDateISO matches local calendar day at local midnight");
  }
  assert(dayKey("2026-09-07") === "2026-09-07", "dayKey date-only passthrough");
  assert(dayKey(new Date(Date.UTC(2026,8,7,21,30)).toISOString()) === localDateISO(new Date(Date.UTC(2026,8,7,21,30))), "dayKey datetime uses local day");
  assert(dayKey(null) === "", "dayKey null -> empty string");

  assert(compareSessionsDesc({date:"2026-09-07"},{date:"2026-09-06"}) < 0, "compareSessionsDesc: later day first");
  assert(compareSessionsDesc({date:"2026-09-07",time_start:"10:00:00"},{date:"2026-09-07",time_start:"09:00:00"}) < 0, "compareSessionsDesc: same day, later time_start first");
  assert(compareSessionsDesc({date:"2026-09-07",time_start:"09:00:00",id:5},{date:"2026-09-07",time_start:"09:00:00",id:3}) < 0, "compareSessionsDesc: same day+time, higher id first");
  assert(compareSessionsDesc({date:"2026-09-07",time_start:null},{date:"2026-09-07",time_start:"09:00:00"}) > 0, "compareSessionsDesc: missing time_start sorts after present one");
  assert(compareSessionsDesc({date:"2026-09-07",time_start:"09:00:00",id:1},{date:"2026-09-07",time_start:"09:00:00",id:1}) === 0, "compareSessionsDesc: identical inputs -> 0");

  {
    const list = [{date:"2026-09-07",time_start:"09:00:00",id:1},{date:"2026-09-07",time_start:"10:00:00",id:2}];
    const sorted = sortSessionsDesc(list);
    assert(list[0].id === 1, "sortSessionsDesc does not mutate input");
    assert(sorted[0].id === 2 && sorted[1].id === 1, "sortSessionsDesc: later time_start first on same day");
  }

  {
    assert(lastTimeForExercise(99, []).length === 0, "lastTimeForExercise: unknown exercise -> []");
    const logs = [
      {exercise:7, date:"2026-09-05", id:1, weight:"50", repetitions:"5"},
      {exercise:7, date:"2026-09-05", id:2, weight:"52.5", repetitions:"5"},
      {exercise:7, date:"2026-09-06", id:3, weight:"55", repetitions:"5"}
    ];
    const r = lastTimeForExercise(7, logs);
    assert(r.length === 1 && r[0].weight === 55, "lastTimeForExercise: returns only most recent day, ascending id");

    const fallbackLogs = [
      {exercise:7, date:"2026-09-01", id:1, weight:"40", repetitions:"8"},
      {exercise:8, date:"2026-09-06", id:2, weight:"20", repetitions:"10"}
    ];
    const fb = lastTimeForExercise(7, fallbackLogs);
    assert(fb.length === 1 && fb[0].weight === 40, "lastTimeForExercise: falls back to older day when absent from newest day");

    const dtLogs = [
      {exercise:7, date:"2026-09-06T18:00:00Z", id:1, weight:"10", repetitions:"10"},
      {exercise:7, date:"2026-09-06T18:00:05Z", id:2, weight:"12", repetitions:"10"}
    ];
    const dt = lastTimeForExercise(7, dtLogs);
    assert(dt.length === 2, "lastTimeForExercise: datetime dates differing by seconds still group as one day");
  }

  {
    const topHeader = document.getElementById("topHeader");
    topHeader.innerHTML = `<button class="backbtn">‹</button><div class="wtitle"><div class="wname">X</div></div>`;
    topHeader.className = "workout-header";
    renderMainHeader();
    assert(document.getElementById("headerSub") !== null, "renderMainHeader: #headerSub restored");
    assert(document.getElementById("topHeader").className === "topbar", "renderMainHeader: className restored to topbar");
    renderMainHeader();
    assert(document.getElementById("headerSub") !== null, "renderMainHeader: idempotent #headerSub");
    assert(document.getElementById("topHeader").className === "topbar", "renderMainHeader: idempotent className");
  }

  {
    const logs = [
      {exercise:1, weight:"100", repetitions:"2"},
      {exercise:1, weight:"60", reps:"10"},
      {exercise:1, weight:"0", repetitions:"20"}
    ];
    const best = computeBestByExercise(logs);
    assert(best[1].w === 100, "computeBestByExercise: heaviest weight");
    assert(best[1].v === 600, "computeBestByExercise: heaviest volume independent of heaviest weight");
    assert(!(2 in best), "computeBestByExercise: weight<=0 logs skipped");
  }

  {
    assert(JSON.stringify(classifySetPR(undefined, 50, 5)) === JSON.stringify({weightPR:false,volumePR:false}), "classifySetPR: undefined prev -> neither");
    const prev = {w:100, v:500};
    assert(classifySetPR(prev, 110, 4).weightPR === true, "classifySetPR: heavier weight -> weightPR");
    assert(classifySetPR(prev, 110, 4).volumePR === false, "classifySetPR: heavier weight, lower vol -> not volumePR");
    assert(classifySetPR(prev, 100, 10).volumePR === true, "classifySetPR: same weight more reps -> volumePR");
    assert(classifySetPR(prev, 100, 10).weightPR === false, "classifySetPR: same weight -> not weightPR");
    assert(classifySetPR(prev, 110, 10).weightPR === true && classifySetPR(prev, 110, 10).volumePR === true, "classifySetPR: both tracks beaten -> both true");
    assert(classifySetPR(prev, 100, 5).weightPR === false, "classifySetPR: equalling prev.w exactly -> not a PR");
    assert(classifySetPR(prev, 90, 4).weightPR === false && classifySetPR(prev, 90, 4).volumePR === false, "classifySetPR: lower on both -> neither");
  }

  {
    const entries = [
      { sets: [{logged:true, weight:50, reps:5}, {logged:false, weight:100, reps:10}, {logged:true, weight:"", reps:5}] }
    ];
    const t = summaryTotals(entries);
    assert(t.sets === 2, "summaryTotals: counts only logged sets");
    assert(t.reps === 10, "summaryTotals: reps sum ignores unlogged row");
    assert(t.volume === 250 && !isNaN(t.volume), "summaryTotals: blank weight contributes 0, no NaN");
  }

  {
    const w = { prs: [] };
    const entry = { exerciseId: 5, name: "Bench" };
    recordPR(w, entry, 100, 3, undefined, {weightPR:true, volumePR:false});
    recordPR(w, entry, 90, 10, {w:100,v:300}, {weightPR:false, volumePR:true});
    assert(w.prs.length === 1, "recordPR: one record per exerciseId");
    assert(w.prs[0].weightPR && w.prs[0].weightPR.weight === 100, "recordPR: weight track not overwritten by later volume-only set");
    assert(w.prs[0].volumePR && w.prs[0].volumePR.weight === 90, "recordPR: volume track recorded");
  }

  console.log(`selftest: ${checks} checks, ${failed} failed`);
}
if(location.hash === "#selftest") runSelfTest();

render();
</script>
